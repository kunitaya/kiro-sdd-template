# Workspace-scoped Kiro permissions template.
#
# Copy/adapt this template into the current workspace trust directory:
#   ~/.kiro/workspace-roots/<hash>/permissions.yaml
# Kiro stores workspace permissions outside the repository so a clone cannot
# grant itself trust. Keep this repository copy as a reviewed template only.
#
# Project-specific paths, package/import names, runtime versions, test-only
# environment variables, and domain documentation hosts are intentionally absent.

rules:
  - capability: fs_read
    effect: deny
    match:
      - .env
      - .env.*
      - "**/.env"
      - "**/.env.*"
      - secrets/**
      - "**/secrets/**"
      - "**/*.pem"
      - "**/*.key"
      - "**/*.p12"
      - "**/*.pfx"
      - "**/id_rsa"
      - "**/id_ed25519"
  - capability: fs_read
    effect: allow
    match:
      - "**"
  - capability: fs_write
    effect: deny
    match:
      - .env
      - .env.*
      - "**/.env"
      - "**/.env.*"
      - secrets/**
      - "**/secrets/**"
      - "**/*.pem"
      - "**/*.key"
      - "**/*.p12"
      - "**/*.pfx"
      - "**/id_rsa"
      - "**/id_ed25519"
