    effect: ask
    match:
      - AGENTS.md
      - .gitignore
      - .githooks/**
      - .github/**
      - .kiro/steering/**
      - .kiro/skills/**
      - .kiro/agents/**
      - .kiro/hooks/**
      - .kiroignore
      - templates/permissions.yaml
      - config.yaml
      - pyproject.toml
      - requirements*.txt
      - uv.lock
      - poetry.lock
      - output/**
      - "**/*.sqlite"
      - "**/*.sqlite3"
      - "**/*.db"
  - capability: fs_write
    effect: allow
    match:
      - src/**
      - tests/**
      - docs/**
      - scripts/**
      - .kiro/specs/**
      - .local/kiro-scratch/**
      - README.md
      - README.ja.md
