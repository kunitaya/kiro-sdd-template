    match:
      - rm*
      - rmdir*
      - unlink*
      - shred*
      - Remove-Item*
      - del *
      - erase *
      - rd *
      - find *-delete*
    exclude:
      - rm .local/kiro-scratch/*
      - rm -f .local/kiro-scratch/*
      - rm -r .local/kiro-scratch/*
      - rm -rf .local/kiro-scratch/*
      - rmdir .local/kiro-scratch/*
      - Remove-Item .local/kiro-scratch/*
      - Remove-Item -Recurse .local/kiro-scratch/*
  - capability: shell
    effect: ask
